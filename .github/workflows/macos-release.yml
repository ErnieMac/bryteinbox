name: macOS releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a v1.0.0-style tag'; exit 1; }
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build desktop screens
        run: bun run build:desktop
      - name: Package macOS app
        run: node scripts/package-macos.mjs ${{ matrix.arch }} "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: release
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          printf '%s\n' 'Download arm64 for Apple silicon or x64 for Intel. Unzip and move BryteInbox.app to Applications. Beeper Desktop must be running. These builds are ad-hoc signed, not Apple-notarized; only install if you trust this repository. If macOS blocks opening, review System Settings → Privacy & Security → Open Anyway. Never disable Gatekeeper globally.' > /tmp/release-notes.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "BryteInbox $RELEASE_TAG" --notes-file /tmp/release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber